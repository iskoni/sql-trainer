<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SQL Trainer Platform</title>

<meta name="description"
      content="Practice SQL with 300+ interactive exercises across 5 difficulty levels. Master SELECT, JOIN, subqueries, window functions, DDL, DML and more.">

<link rel="stylesheet"
      href="style.css">

<!-- CodeMirror -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

</head>

<body>

<div class="app-container">

    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside class="sidebar">

        <h1>SQL Trainer</h1>

        <div class="section">

            <label for="difficulty">
                Difficulty
            </label>

            <select id="difficulty">

                <option value="Beginner">
                    Beginner
                </option>

                <option value="Elementary">
                    Elementary
                </option>

                <option value="Intermediate">
                    Intermediate
                </option>

                <option value="Advanced">
                    Advanced
                </option>

                <option value="Proficient">
                    Proficient
                </option>
                <option value="Expert">
                    Expert
                </option>

            </select>

        </div>

        <div class="section">

            <h3>Topics</h3>

            <ul id="topics">

            </ul>

        </div>

        <div class="section">

            <h3>Available Tables</h3>

            <ul id="tablesList"
                class="tables">

            </ul>

        </div>

    </aside>

    <!-- =====================
         MAIN
    ====================== -->

    <main class="main">

        <header class="topbar">

            <button id="mobileMenuBtn" class="hamburger-btn">☰</button>

            <div>

                <h2>SQL Playground</h2>

                <p>
                    Practice SQL against a live browser database.
                </p>

            </div>

        </header>

        <!-- EXERCISE CARD -->

        <section class="exercise-card">

            <div class="exercise-meta">

                <span id="difficultyBadge"
                      class="badge badge-beginner">

                    Beginner

                </span>

                <span id="topicBadge"
                      class="badge topic-badge">

                    SELECT

                </span>

                <select id="exerciseCounter" class="badge counter-badge exercise-selector">
                </select>

            </div>

            <h3>Exercise</h3>

            <p id="exerciseText">

                Loading exercise...

            </p>

            <!-- Note for non-SQLite exercises -->

            <div id="noteBox"
                 class="note-box hidden">

            </div>

            <!-- Schema -->

            <div id="schemaBox"
                 class="schema-box hidden">

                <h4>Database Schema</h4>

                <ul id="schemaList"
                    class="schema-list">

                </ul>

            </div>

            <button id="toggleSchemaBtn"
                    class="btn btn-secondary">

                Show Schema

            </button>

            <!-- Hint -->

            <div id="hintBox"
                 class="hidden">

            </div>

            <!-- Actions -->

            <div class="action-row">

                <button id="runBtn"
                        class="btn btn-primary">

                    ▶ Run

                </button>

                <button id="hintBtn"
                        class="btn btn-secondary">

                    💡 Hint

                </button>

                <button id="resetBtn"
                        class="btn btn-secondary">

                    ↻ Reset DB

                </button>

                <button id="nextBtn"
                        class="btn btn-primary">

                    Next Exercise

                </button>

            </div>

        </section>

        <!-- EDITOR -->

        <section class="editor-section">

            <textarea id="sql-editor"></textarea>

        </section>

        <!-- RESULTS -->

        <section class="results">

            <h3>Query Results</h3>

            <div id="output">

                Ready.

            </div>

        </section>

    </main>

</div>

<!-- SQL.js -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>

<!-- CodeMirror -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>

<!-- APP -->

<script src="js/database.js"></script>
<script src="js/exercises_beginner.js"></script>
<script src="js/exercises_elementary.js"></script>
<script src="js/exercises_intermediate.js"></script>
<script src="js/exercises_advanced.js"></script>
<script src="js/exercises_proficient.js"></script>
<script src="js/exercises_expert.js"></script>
<script src="js/validator.js"></script>
<script src="js/app.js"></script>

</body>
</html>
