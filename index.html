<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SQL Trainer Platform</title>

<meta name="description"
      content="Practice SQL with 330 interactive exercises across 6 difficulty levels from Beginner to Expert. Master SELECT, JOIN, subqueries, window functions, CTEs, DDL, DML, and data analytics.">

<link rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Cellipse cx='32' cy='18' rx='18' ry='7' fill='%233b82f6'/%3E%3Cpath d='M14 18v14c0 3.87 8.06 7 18 7s18-3.13 18-7V18c0 3.87-8.06 7-18 7s-18-3.13-18-7z' fill='%232563eb'/%3E%3Cpath d='M14 32v14c0 3.87 8.06 7 18 7s18-3.13 18-7V32c0 3.87-8.06 7-18 7s-18-3.13-18-7z' fill='%231d4ed8'/%3E%3C/svg%3E">

<link rel="stylesheet"
      href="style.css?v=1.3">

<!-- CodeMirror -->

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

</head>

<body>

<div class="app-container">

    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside class="sidebar">

        <h1>SQL Trainer</h1>

        <div class="section">

            <label for="difficulty">
                Difficulty
            </label>

            <select id="difficulty">

                <option value="Beginner">
                    Beginner
                </option>

                <option value="Elementary">
                    Elementary
                </option>

                <option value="Intermediate">
                    Intermediate
                </option>

                <option value="Advanced">
                    Advanced
                </option>

                <option value="Proficient">
                    Proficient
                </option>
                <option value="Expert">
                    Expert
                </option>

            </select>

        </div>

        <div class="section">

            <h3>Topics</h3>

            <ul id="topics">

            </ul>

        </div>

        <div class="section">

            <h3>Available Tables</h3>

            <ul id="tablesList"
                class="tables">

            </ul>

        </div>

    </aside>

    <!-- =====================
         MAIN
    ====================== -->

    <main class="main">

        <header class="topbar">

            <button id="mobileMenuBtn" class="hamburger-btn">☰</button>

            <div class="topbar-title">

                <h2>SQL Playground</h2>

                <p>
                    Practice SQL against a live browser database.
                </p>

            </div>

            <div class="progress-badge">
                <span id="progressSummary" aria-live="polite">
                    0 / 0 solved • 0 XP
                </span>
                <button type="button"
                        id="resetProgressBtn"
                        class="progress-reset-btn"
                        title="Reset all solved exercises, XP score, and saved query drafts"
                        aria-label="Reset all progress">
                    ↻
                </button>
            </div>

        </header>

        <!-- EXERCISE CARD -->

        <section class="exercise-card">

            <div class="exercise-meta">

                <span id="difficultyBadge"
                      class="badge badge-beginner">

                    Beginner

                </span>

                <span id="topicBadge"
                      class="badge topic-badge">

                    SELECT

                </span>

                <select id="exerciseCounter" class="badge counter-badge exercise-selector">
                </select>

            </div>

            <h3>Exercise</h3>

            <p id="exerciseText">

                Loading exercise...

            </p>

            <!-- Note for non-SQLite exercises -->

            <div id="noteBox"
                 class="note-box hidden">

            </div>

            <!-- Schema -->

            <div id="schemaBox"
                 class="schema-box hidden">

                <div class="schema-header">

                    <h4>Database Schema</h4>

                    <div class="view-tabs" role="tablist">
                        <button type="button" id="schemaListTab" class="tab-btn active">
                            List View
                        </button>
                        <button type="button" id="schemaErdTab" class="tab-btn">
                            Visual ERD
                        </button>
                    </div>

                </div>

                <div id="schemaListView">
                    <ul id="schemaList"
                        class="schema-list">

                    </ul>
                </div>

                <div id="schemaErdView" class="hidden">

                    <div class="erd-toolbar">
                        <div class="erd-filter-group">
                            <label for="erdScopeSelect">Scope:</label>
                            <select id="erdScopeSelect" class="compact-select">
                                <option value="relevant">Relevant to Exercise</option>
                                <option value="all">All Tables</option>
                                <option value="ecommerce">E-Commerce &amp; Sales</option>
                                <option value="hr">HR &amp; Projects</option>
                                <option value="analytics">Web &amp; IoT Analytics</option>
                                <option value="library">Library &amp; Demographics</option>
                            </select>
                            <span id="erdMetaLabel" class="erd-meta-label"></span>
                        </div>

                        <div class="erd-zoom-controls">
                            <button type="button" id="erdZoomOutBtn" class="btn-icon" title="Zoom Out">−</button>
                            <span id="erdZoomLabel" class="erd-zoom-label">100%</span>
                            <button type="button" id="erdZoomInBtn" class="btn-icon" title="Zoom In">+</button>
                            <button type="button" id="erdZoomResetBtn" class="btn-icon" title="Reset Zoom">Reset</button>
                            <button type="button" id="erdFullscreenBtn" class="btn-icon" title="Open Fullscreen ERD">⤢ Expand</button>
                        </div>
                    </div>

                    <div id="erdViewport" class="erd-viewport">
                        <div id="erdDiagram" class="erd-diagram"></div>
                    </div>

                </div>

            </div>

            <button id="toggleSchemaBtn"
                    class="btn btn-secondary">

                Show Schema

            </button>

            <!-- Hint -->

            <div id="hintBox"
                 class="hidden">

            </div>

            <!-- Actions -->

            <div class="action-row">

                <button id="runBtn"
                        class="btn btn-primary"
                        title="Run Query (Ctrl+Enter)">

                    ▶ Run

                </button>

                <button id="hintBtn"
                        class="btn btn-secondary">

                    💡 Hint

                </button>

                <button id="resetBtn"
                        class="btn btn-secondary">

                    ↻ Reset DB

                </button>

                <button id="nextBtn"
                        class="btn btn-primary">

                    Next Exercise

                </button>

            </div>

        </section>

        <!-- EDITOR -->

        <section class="editor-section">

            <textarea id="sql-editor"></textarea>

        </section>

        <!-- RESULTS -->

        <section class="results">

            <div id="validationOutput"></div>

            <div class="results-header">

                <h3>Query Results</h3>

                <div id="resultsTabs" class="view-tabs hidden" role="tablist">
                    <button type="button" id="tableTabBtn" class="tab-btn active">
                        Table
                    </button>
                    <button type="button" id="chartTabBtn" class="tab-btn">
                        Chart
                    </button>
                </div>

            </div>

            <div id="output">

                Ready.

            </div>

            <div id="chartView" class="chart-view hidden">

                <div class="chart-toolbar">

                    <div class="chart-control">
                        <label for="chartTypeSelect">Type:</label>
                        <select id="chartTypeSelect" class="compact-select">
                            <option value="bar">Bar</option>
                            <option value="line">Line</option>
                            <option value="pie">Pie</option>
                            <option value="doughnut">Doughnut</option>
                        </select>
                    </div>

                    <div class="chart-control">
                        <label for="chartXSelect">X-Axis:</label>
                        <select id="chartXSelect" class="compact-select"></select>
                    </div>

                    <div class="chart-control">
                        <label for="chartYSelect">Y-Axis:</label>
                        <select id="chartYSelect" class="compact-select"></select>
                    </div>

                </div>

                <div class="chart-canvas-wrapper">
                    <canvas id="resultChartCanvas"></canvas>
                </div>

            </div>

        </section>

    </main>

</div>

<!-- FULLSCREEN ERD MODAL -->

<div id="erdModal" class="erd-modal hidden" role="dialog" aria-modal="true" aria-label="Database Entity-Relationship Diagram">
    <div class="erd-modal-content">
        <div class="erd-modal-header">
            <h3>Entity-Relationship Diagram</h3>
            <div class="erd-toolbar-modal">
                <select id="erdModalScopeSelect" class="compact-select">
                    <option value="relevant">Relevant to Exercise</option>
                    <option value="all">All Tables</option>
                    <option value="ecommerce">E-Commerce &amp; Sales</option>
                    <option value="hr">HR &amp; Projects</option>
                    <option value="analytics">Web &amp; IoT Analytics</option>
                    <option value="library">Library &amp; Demographics</option>
                </select>
                <span id="erdModalMetaLabel" class="erd-meta-label"></span>
                <div class="erd-zoom-controls">
                    <button type="button" id="erdModalZoomOutBtn" class="btn-icon" title="Zoom Out">−</button>
                    <span id="erdModalZoomLabel" class="erd-zoom-label">100%</span>
                    <button type="button" id="erdModalZoomInBtn" class="btn-icon" title="Zoom In">+</button>
                    <button type="button" id="erdModalZoomResetBtn" class="btn-icon" title="Reset Zoom">Reset</button>
                </div>
                <button type="button" id="erdModalCloseBtn" class="btn-icon btn-close-modal" title="Close">✕</button>
            </div>
        </div>
        <div id="erdModalViewport" class="erd-viewport erd-viewport-modal">
            <div id="erdModalDiagram" class="erd-diagram"></div>
        </div>
    </div>
</div>

<!-- SQL.js -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>

<!-- CodeMirror -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/display/placeholder.min.js"></script>

<!-- Chart.js & Mermaid -->

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>

<!-- APP -->

<script src="js/database.js?v=1.3"></script>
<script src="js/exercises_beginner.js?v=1.3"></script>
<script src="js/exercises_elementary.js?v=1.3"></script>
<script src="js/exercises_intermediate.js?v=1.3"></script>
<script src="js/exercises_advanced.js?v=1.3"></script>
<script src="js/exercises_proficient.js?v=1.3"></script>
<script src="js/exercises_expert.js?v=1.3"></script>
<script src="js/validator.js?v=1.3"></script>
<script src="js/visualizer.js?v=1.3"></script>
<script src="js/app.js?v=1.3"></script>

</body>
</html>
