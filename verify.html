<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Exercise Verifier</title></head>
<body>
<h1>SQL Trainer — Exercise Verification</h1>
<pre id="log">Loading...</pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>
<script src="js/database.js"></script>
<script src="js/exercises_beginner.js"></script>
<script src="js/exercises_elementary.js"></script>
<script src="js/exercises_intermediate.js"></script>
<script src="js/exercises_advanced.js"></script>
<script src="js/exercises_proficient.js"></script>
<script src="js/validator.js"></script>
<script>
(async function(){
    const log = document.getElementById('log');
    const lines = [];
    function print(msg){ lines.push(msg); log.textContent = lines.join('\n'); }

    await Database.init();
    const exercises = window.Exercises || [];
    print(`Total exercises loaded: ${exercises.length}`);

    // Check for duplicate IDs
    const ids = exercises.map(e => e.id);
    const dupes = ids.filter((id, i) => ids.indexOf(id) !== i);
    if(dupes.length > 0){
        print(`❌ DUPLICATE IDs: ${[...new Set(dupes)].join(', ')}`);
    } else {
        print(`✅ No duplicate IDs`);
    }

    // Check difficulty distribution
    const levels = ['Beginner','Elementary','Intermediate','Advanced','Proficient'];
    levels.forEach(level => {
        const count = exercises.filter(e => e.difficulty === level).length;
        print(`  ${level}: ${count} exercises`);
    });

    // Check all exercises have required fields
    let missingFields = 0;
    exercises.forEach(e => {
        const required = ['id','difficulty','topic','title','prompt','hint','expectedQuery','xp'];
        required.forEach(f => {
            if(!e[f] && e[f] !== 0){
                // For conceptual exercises, expectedQuery might be present
                if(f === 'expectedQuery' && e.note) return;
                print(`❌ Exercise ${e.id} missing field: ${f}`);
                missingFields++;
            }
        });
    });
    if(missingFields === 0) print(`✅ All exercises have required fields`);

    // Check hint quality (not empty, not too short)
    let badHints = 0;
    exercises.forEach(e => {
        if(!e.hint || e.hint.length < 15){
            print(`⚠ Exercise ${e.id}: hint too short (${(e.hint||'').length} chars): "${e.hint}"`);
            badHints++;
        }
        // Check hint doesn't contain the full expectedQuery
        if(e.hint && e.expectedQuery && e.hint.includes(e.expectedQuery)){
            print(`⚠ Exercise ${e.id}: hint reveals full answer`);
            badHints++;
        }
    });
    if(badHints === 0) print(`✅ All hints are meaningful (>15 chars, don't reveal answer)`);

    // Check schema matches seed
    const schemaEntries = Database.getSchema();
    print(`\nSchema entries: ${schemaEntries.length}`);
    schemaEntries.forEach(s => {
        const tableName = s.split('(')[0];
        Database.reset();
        const result = Database.execute(`SELECT * FROM ${tableName} LIMIT 1;`);
        if(result.success){
            print(`  ✅ Table ${tableName} exists and queryable`);
        } else {
            print(`  ❌ Table ${tableName} FAILED: ${result.error}`);
        }
    });

    // Verify each exercise's expectedQuery
    print(`\n--- Running expectedQuery for each exercise ---`);
    let passed = 0;
    let failed = 0;
    let conceptual = 0;

    for(const ex of exercises){
        Database.reset();

        // Skip conceptual exercises that are just SELECT 'concept'
        if(ex.note && ex.expectedQuery && ex.expectedQuery.includes("AS concept")){
            conceptual++;
            continue;
        }

        // Run setup if any
        if(ex.setupSQL){
            Database.execute(ex.setupSQL);
        }

        const result = Database.execute(ex.expectedQuery);
        if(result.success){
            passed++;
        } else {
            print(`  ❌ Exercise ${ex.id} (${ex.difficulty}/${ex.topic}): ${result.error}`);
            print(`     Query: ${ex.expectedQuery.substring(0, 120)}`);
            failed++;
        }
    }

    print(`\n=== RESULTS ===`);
    print(`Total: ${exercises.length}`);
    print(`Passed: ${passed}`);
    print(`Failed: ${failed}`);
    print(`Conceptual (skipped): ${conceptual}`);
    print(`\n${failed === 0 ? '🎉 ALL EXERCISES VERIFIED SUCCESSFULLY!' : '⚠ SOME EXERCISES FAILED — see above'}`);

    // Verify DML exercises
    print(`\n--- Verifying DML/DDL exercises ---`);
    let dmlPassed = 0;
    let dmlFailed = 0;
    const dmlExercises = exercises.filter(e => e.validationType);

    for(const ex of dmlExercises){
        Database.reset();
        if(ex.setupSQL) Database.execute(ex.setupSQL);

        // Run the expected query
        const execResult = Database.execute(ex.expectedQuery);
        if(!execResult.success){
            // Already counted above, skip
            continue;
        }

        // Run verification query if exists
        if(ex.verificationQuery){
            const verResult = Database.execute(ex.verificationQuery);
            if(verResult.success){
                dmlPassed++;
            } else {
                print(`  ❌ Exercise ${ex.id} verification query failed: ${verResult.error}`);
                dmlFailed++;
            }
        } else if(ex.expectedSchema){
            // Check schema
            const check = Database.execute(`PRAGMA table_info(${ex.expectedSchema.tableName});`);
            if(check.success && check.data.length > 0){
                dmlPassed++;
            } else {
                print(`  ❌ Exercise ${ex.id} schema check failed`);
                dmlFailed++;
            }
        } else {
            dmlPassed++;
        }
    }

    print(`DML/DDL exercises: ${dmlExercises.length}`);
    print(`Verification passed: ${dmlPassed}`);
    print(`Verification failed: ${dmlFailed}`);

    // Show Schema button check
    print(`\n--- Show Schema button verification ---`);
    const schema = Database.getSchema();
    print(`Schema returns ${schema.length} entries: ${schema.length >= 10 ? '✅' : '❌'}`);

    print(`\n=== VERIFICATION COMPLETE ===`);
})();
</script>
</body>
</html>
